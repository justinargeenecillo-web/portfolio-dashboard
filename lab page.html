<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files</title>
    <!-- Ensure style.css exists or remove this line if you don't have it -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Basic styling added here in case style.css is missing */
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .upload-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .menu { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .menu a { color: white; text-decoration: none; margin-right: 15px; }
        .upload-section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <nav class="menu">
        <a href="index.html" id="nav-home">🏠 Home</a>
        <a href="dashboard.html" id="nav-dashboard">📊 Dashboard</a>
        <a href="quiz.html" id="nav-quiz">📝 Quiz</a>
        <a href="lab.html" id="nav-lab">🧪 Lab Work</a>
        <a href="exam.html" id="nav-exam">📋 Exam</a>
    </nav>

    <div class="upload-container">
        <!-- QUIZ UPLOAD -->
        <div class="upload-section">
            <h2>📝 Quiz Upload <span id="quizCounter">0</span></h2>
            <form id="quizForm">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="quizTitle" placeholder="Quiz #1" required>
                </div>
                <div class="form-group">
                    <label>Quiz File:</label>
                    <input type="file" id="quizFile" accept=".pdf,.doc" required>
                </div>
                <div class="form-group">
                    <label>Proof Image *:</label>
                    <input type="file" id="quizProof" accept="image/*" required>
                </div>
                <button type="button" onclick="uploadQuiz()">📤 Upload Quiz</button>
            </form>
        </div>

        <!-- LAB UPLOAD -->
        <div class="upload-section">
            <h2>🧪 Lab Work Upload <span id="labCounter">0</span></h2>
            <form id="labForm">
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="labTitle" placeholder="Lab description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Lab File:</label>
                    <input type="file" id="labFile" accept=".html, .css" required>
                </div>
                <div class="form-group">
                    <label>Proof Image *:</label>
                    <input type="file" id="labProof" accept="image/*" required>
                </div>
                <button type="button" onclick="uploadLab()">📤 Upload Lab</button>
            </form>
        </div>

        <!-- EXAM UPLOAD -->
        <div class="upload-section">
            <h2>📋 Major Exam Upload <span id="examCounter">0</span></h2>
            <form id="examForm">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="examTitle" placeholder="Exam Final" required>
                </div>
                <div class="form-group">
                    <label>Score (0-100):</label>
                    <input type="number" id="examScore" placeholder="95" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>Exam File:</label>
                    <input type="file" id="examFile" accept=".pdf,image/*" required>
                </div>
                <div class="form-group">
                    <label>Proof Image *:</label>
                    <input type="file" id="examProof" accept="image/*" required>
                </div>
                <button type="button" onclick="uploadExam()">📤 Upload Exam</button>
            </form>
        </div>
    </div>

    <script>
        // ===========================================
        // UPLOADS JAVASCRIPT
        // ===========================================
        
        let quizCount = 0, labCount = 0, examCount = 0;
        
        // --- QUIZ UPLOAD FUNCTION (Added) ---
        function uploadQuiz() {
            let title = document.getElementById('quizTitle').value;
            let file = document.getElementById('quizFile').files[0];
            let proof = document.getElementById('quizProof').files[0];
            
            if (title && file && proof) {
                quizCount++;
                document.getElementById('quizCounter').textContent = quizCount;
                alert(`✅ Quiz "${title}" uploaded!\nTotal Quizzes: ${quizCount}`);
                document.getElementById('quizForm').reset();
            } else {
                alert('❌ Please fill in all fields!');
            }
        }
        
        // --- LAB UPLOAD FUNCTION (Original) ---
        function uploadLab() {
            let title = document.getElementById('labTitle').value;
            let file = document.getElementById('labFile').files[0];
            let proof = document.getElementById('labProof').files[0];
            
            if (title && file && proof) {
                labCount++;
                document.getElementById('labCounter').textContent = labCount;
                alert(`✅ Lab uploaded!\nDescription: ${title.substring(0,30)}...\nTotal Labs: ${labCount}`);
                document.getElementById('labForm').reset();
            } else {
                alert('❌ Fill all fields!');
            }
        }
